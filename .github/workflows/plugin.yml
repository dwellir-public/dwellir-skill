name: Plugin package
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_plugin.py
      - run: python -m json.tool dist/dwellir/.codex-plugin/plugin.json > /dev/null
      - run: python scripts/validate_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: dwellir-plugin
          path: dist/dwellir-plugin.zip
